name: Sync Imoveis

on:
  schedule:
    - cron: '0 23 * * *' # 20h Brasil (UTC-3)
  workflow_dispatch: # permite rodar manual

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Run sync
        run: node sync.js

      - name: Commit changes
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add .
          git commit -m "🔄 Atualiza imóveis" || echo "Sem mudanças"

      - name: Push
        run: git push